<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #4CAF50;
        }
        .quiz-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .question {
            font-size: 18px;
            margin-bottom: 10px;
        }
        .answers {
            margin-bottom: 20px;
        }
        .answers input {
            margin-right: 10px;
        }
        .result {
            font-size: 20px;
            text-align: center;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Willkommen zum Quiz!</h1>
    <div class="quiz-container">
        <div id="quiz">
            <div class="question">
                <p>1. Wie viele Kontinente gibt es auf der Erde?</p>
                <div class="answers">
                    <label><input type="radio" name="q1" value="3"> 5</label><br>
                    <label><input type="radio" name="q1" value="0"> 6</label><br>
                    <label><input type="radio" name="q1" value="1"> 7</label><br>
                    <label><input type="radio" name="q1" value="0"> 8</label>
                </div>
            </div>

            <div class="question">
                <p>2. Was ist die Hauptstadt von Frankreich?</p>
                <div class="answers">
                    <label><input type="radio" name="q2" value="0"> London</label><br>
                    <label><input type="radio" name="q2" value="1"> Paris</label><br>
                    <label><input type="radio" name="q2" value="0"> Madrid</label><br>
                    <label><input type="radio" name="q2" value="0"> Rom</label>
                </div>
            </div>

            <div class="question">
                <p>3. Welches Element hat das chemische Symbol "O"?</p>
                <div class="answers">
                    <label><input type="radio" name="q3" value="1"> Sauerstoff</label><br>
                    <label><input type="radio" name="q3" value="0"> Wasserstoff</label><br>
                    <label><input type="radio" name="q3" value="0"> Stickstoff</label><br>
                    <label><input type="radio" name="q3" value="0"> Helium</label>
                </div>
            </div>

            <button onclick="checkAnswers()">Quiz abschließen</button>
        </div>

        <div id="result" class="result"></div>
    </div>

    <script>
        function checkAnswers() {
            var score = 0;

            // Frage 1
            var q1 = document.querySelector('input[name="q1"]:checked');
            if (q1 && q1.value == "1") score++;

            // Frage 2
            var q2 = document.querySelector('input[name="q2"]:checked');
            if (q2 && q2.value == "1") score++;

            // Frage 3
            var q3 = document.querySelector('input[name="q3"]:checked');
            if (q3 && q3.value == "1") score++;

            // Ergebnis anzeigen
            var result = document.getElementById('result');
            result.style.display = 'block';
            result.textContent = "Du hast " + score + " von 3 Punkten erreicht!";
        }
    </script>
</body>
</html>
